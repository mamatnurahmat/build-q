# ─────────────────────────────────────────────────────────────────────────
# Jev Web Chat — bq --serve 8888 (STATELESS BASE)
#
# Compose ini BISA JALAN DI MESIN MANAPUN tanpa host mount.
# Semua config via environment variable. Cukup:
#
#   cp .env.example .env     # isi minimal: TYPESAFE_API_KEY
#   docker compose up -d
#
# Untuk fitur tambahan (Docker build, kubectl, SOPS, SSH), salin
# compose.override.yaml.example → compose.override.yaml (auto-merge).
# ─────────────────────────────────────────────────────────────────────────

services:
  jev-chat:
    image: ${JEV_IMAGE:-newrahmat/jev}:${BUILD_Q_VERSION:-0.1.43}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_Q_VERSION: ${BUILD_Q_VERSION:-0.1.43}
    container_name: jev-chat
    hostname: jev-chat
    restart: unless-stopped
    init: false
    stop_grace_period: 30s

    ports:
      - "${JEV_BIND_ADDR:-0.0.0.0}:${JEV_HOST_PORT:-8888}:8888"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      # ─── Jev provider ────────────────────────────────────────────────
      JEV_PROVIDER:           ${JEV_PROVIDER:-typesafe}
      TYPESAFE_API_KEY:       ${TYPESAFE_API_KEY:-}
      OPENROUTER_API_KEY:     ${OPENROUTER_API_KEY:-}

      # ─── PocketBase IDP (optional) ──────────────────────────────────
      PB_API:                 ${PB_API:-false}
      PB_API_URL:             ${PB_API_URL:-}
      PB_API_USER:            ${PB_API_USER:-}
      PB_API_PASS:            ${PB_API_PASS:-}

      # ─── GitHub ─────────────────────────────────────────────────────
      GITHUB_TOKEN:           ${GITHUB_TOKEN:-}
      GITHUB_ORG:             ${GITHUB_ORG:-}
      GH_CLI:                 ${GH_CLI:-false}

      # ─── Docker Hub (opsional) ──────────────────────────────────────
      DOCKERHUB_ORG:          ${DOCKERHUB_ORG:-}
      REGISTRY_URL:           ${REGISTRY_URL:-}
      DOCKERHUB_USER:         ${DOCKERHUB_USER:-}
      DOCKERHUB_TOKEN:        ${DOCKERHUB_TOKEN:-}
      DOCKER_LOGIN_REGISTRY:  ${DOCKER_LOGIN_REGISTRY:-}

      # ─── SOPS (opsional) ────────────────────────────────────────────
      BUILD_Q_SOPS_AGE_RECIPIENT: ${BUILD_Q_SOPS_AGE_RECIPIENT:-}

      # ─── Serve mode ─────────────────────────────────────────────────
      BQ_SERVE_TOKEN:         ${BQ_SERVE_TOKEN:-}
      BQ_SERVE_NO_EXEC:       ${BQ_SERVE_NO_EXEC:-}
      BUILD_Q_TUI_CACHE_TTL:  ${BUILD_Q_TUI_CACHE_TTL:-3600}

    volumes:
      # Persistent state (config, cache, audit log)
      - bq-config:/root/.build-q
      # Workspace (git clone, gitops ops)
      - bq-workspace:/workspace

    networks:
      - jev-net

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      com.qoin.service: "jev-chat"
      com.qoin.component: "devops-tooling"
      com.qoin.version: "${BUILD_Q_VERSION:-0.1.43}"

networks:
  jev-net:
    name: jev-net
    driver: bridge

volumes:
  bq-config:
    name: jev-chat-config
  bq-workspace:
    name: jev-chat-workspace
