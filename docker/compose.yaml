# Jev Web Chat — bq --serve 8888 via Docker Compose
# Docker-outside-of-Docker (DooD): mount /var/run/docker.sock untuk akses
# FULL ke Docker daemon host. Semua `bq --remote`, `bq --compose`,
# `docker buildx build` dalam container akan jalan di daemon host.
#
# Quick start:
#   cd docker/
#   cp .env.example .env
#   # edit .env isi secret (minimal TYPESAFE_API_KEY + GITHUB_TOKEN)
#   docker compose up -d --build
#   open http://localhost:8888

services:
  jev-chat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BUILD_Q_VERSION: ${BUILD_Q_VERSION:-0.1.42}
    image: build-q:${BUILD_Q_VERSION:-0.1.42}
    container_name: jev-chat
    hostname: jev-chat
    restart: unless-stopped

    ports:
      # Default expose ke LAN. Ganti ke "127.0.0.1:8888:8888" untuk
      # localhost-only (konsisten dgn default `bq --serve` tanpa container).
      - "${JEV_HOST_PORT:-8888}:8888"

    environment:
      # ─── Jev provider (pilih salah satu API key) ─────────────────────
      JEV_PROVIDER:         ${JEV_PROVIDER:-typesafe}
      TYPESAFE_API_KEY:     ${TYPESAFE_API_KEY:-}
      OPENROUTER_API_KEY:   ${OPENROUTER_API_KEY:-}

      # ─── PocketBase centralized IDP (optional, auto-hydrate secrets) ─
      PB_API:               ${PB_API:-true}
      PB_API_URL:           ${PB_API_URL:-https://cicd-hw.qoin.id/devops}
      PB_API_USER:          ${PB_API_USER:-}
      PB_API_PASS:          ${PB_API_PASS:-}

      # ─── GitHub (bq clone, push, PR) ─────────────────────────────────
      GITHUB_TOKEN:         ${GITHUB_TOKEN:-}
      GITHUB_ORG:           ${GITHUB_ORG:-Qoin-Digital-Indonesia}
      GH_CLI:               ${GH_CLI:-false}

      # ─── Docker Hub + Registry (image push) ──────────────────────────
      DOCKERHUB_ORG:        ${DOCKERHUB_ORG:-loyaltolpi}
      REGISTRY_URL:         ${REGISTRY_URL:-docker.io/loyaltolpi}

      # ─── SOPS encryption (bq --sops-encrypt, bootstrap-k8s secrets) ──
      BUILD_Q_SOPS_AGE_RECIPIENT: ${BUILD_Q_SOPS_AGE_RECIPIENT:-}

      # ─── Serve mode options ──────────────────────────────────────────
      BQ_SERVE_TOKEN:       ${BQ_SERVE_TOKEN:-}
      BQ_SERVE_NO_EXEC:     ${BQ_SERVE_NO_EXEC:-}

      # ─── Build-q tuning ──────────────────────────────────────────────
      BUILD_Q_TUI_CACHE_TTL: ${BUILD_Q_TUI_CACHE_TTL:-3600}

    volumes:
      # ═══ Docker-in-Docker (sock access FULL) ═══════════════════════════
      # Container punya akses penuh ke Docker daemon host.
      # Resiko: container compromise = host Docker compromise.
      # Mitigasi: hanya expose ke LAN tim DevOps (set BQ_SERVE_TOKEN).
      - /var/run/docker.sock:/var/run/docker.sock

      # ═══ Kubectl ═══════════════════════════════════════════════════════
      # Mount kubeconfig host (read-only). Harus pakai in-cluster service
      # account bila cluster endpoint berupa internal DNS; untuk cluster
      # publik (EKS/GKE/CCE) biasanya tinggal mount.
      - ${KUBECONFIG_HOST:-${HOME}/.kube/config}:/root/.kube/config:ro

      # ═══ build-q persistent state ══════════════════════════════════════
      # Config .env, TUI cache, PB cache, audit log — pakai named volume
      # agar persistent antar restart.
      - bq-config:/root/.build-q

      # ═══ Workspace untuk git clone / gitops repo ══════════════════════
      # `bq --pr-fix`, `bq --bootstrap-k8s`, `bq --gitops-set-image`
      # butuh workspace writable. Named volume agar persistent.
      - bq-workspace:/workspace

      # ═══ SOPS age keys (read-only) ════════════════════════════════════
      - ${HOME}/.config/sops:/root/.config/sops:ro

      # ═══ SSH keys untuk git SSH (optional, read-only) ═════════════════
      # Komentar bila pakai GITHUB_TOKEN HTTPS saja.
      - ${HOME}/.ssh:/root/.ssh:ro

      # ═══ Docker config untuk registry auth (optional) ═════════════════
      # Pakai bila `docker push` dari dalam container butuh auth yg sama
      # dgn host.
      - ${HOME}/.docker/config.json:/root/.docker/config.json:ro

    networks:
      - jev-net

    # Opsional: labels untuk traefik / reverse-proxy integration
    labels:
      com.qoin.service: "jev-chat"
      com.qoin.component: "devops-tooling"
      com.qoin.version:   "${BUILD_Q_VERSION:-0.1.42}"

networks:
  jev-net:
    driver: bridge

volumes:
  bq-config:
    name: jev-chat-config
  bq-workspace:
    name: jev-chat-workspace
