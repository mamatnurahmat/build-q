apiVersion: v1
kind: Service
metadata:
  name: {{APP}}
  namespace: {{NAMESPACE}}
  labels:
    app: {{APP}}
    env: {{ENV}}
    project: {{PROJECT}}
    role: {{ROLE}}
spec:
  type: ClusterIP
  selector:
    app: {{APP}}
  ports:
    - name: http
      port: {{PORT}}
      targetPort: http
      protocol: TCP
